name: Release Go Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Merged stable version, for example v1.0.3'
        required: true
        type: string

concurrency:
  group: cloudmanager-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  goreleaser:
    if: github.ref == 'refs/heads/release/stable' && github.repository == 'vyoogam/cloudmanager'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Validate release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-tag "$RELEASE_VERSION" --check
      - name: Build and test
        run: make ci
      - name: Create or resume release tag
        id: tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/release-tag "$RELEASE_VERSION"
      - name: Publish artifacts and Homebrew update
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.9.0'
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
